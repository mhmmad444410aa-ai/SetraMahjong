name: Verify launcher of published Setra Mahjong 1.3.0
on:
  push:
    paths: ['.github/workflows/verify-delivered-launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "build-tools;36.0.0"
      - name: Download published signed review candidate and verify actual launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44881746756 --repo "$GITHUB_REPOSITORY" --name SetraMahjong-1.3.0-Signed-Review-Candidate-production --dir delivered
          APK=$(find delivered -name app-release.apk -print -quit)
          test -s "$APK"
          test "$(sha256sum "$APK" | awk '{print $1}')" = 1dbf0ecc01dd8b8d5404a2355f39cbfbf4a5901e939cac6c2fd223547b1efe70
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^package:|^launchable-activity:|^application-label"
          LAUNCHER=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "^launchable-activity:" || true)
          if grep -F 'com.mhmmad.setramahjong.expansion.GardenActivity' <<< "$LAUNCHER"; then
            echo "RELEASE VERIFIED: 1.3.0 starts with the new Garden puzzle modes hub."
          else
            echo "::error::Published APK DOES NOT start with new puzzle hub; must fix release before user installs."
            exit 1
          fi
