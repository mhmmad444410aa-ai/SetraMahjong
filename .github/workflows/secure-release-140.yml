name: Secure One-Time Setra Mahjong 1.4.0 Signed Release

on:
  workflow_dispatch:
    inputs:
      advertising:
        description: "Ad mode"
        type: choice
        required: true
        default: production
        options:
          - production
          - test
          - offline
  push:
    branches: [feature/setra-1.4.0]
    paths:
      - ".github/workflows/secure-release-140.yml"

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SETRA_KEYSTORE_BASE64: ${{ secrets.SETRA_KEYSTORE_BASE64 }}
      SETRA_STORE_PASSWORD: ${{ secrets.SETRA_STORE_PASSWORD }}
      SETRA_KEY_ALIAS: ${{ secrets.SETRA_KEY_ALIAS }}
      SETRA_KEY_PASSWORD: ${{ secrets.SETRA_KEY_PASSWORD }}
      SETRA_DEVELOPER_NAME: ${{ secrets.SETRA_DEVELOPER_NAME }}
      SETRA_CONTACT_EMAIL: ${{ secrets.SETRA_CONTACT_EMAIL }}
      SETRA_PRIVACY_URL: ${{ secrets.SETRA_PRIVACY_URL }}
      ADS_BUILD_MODE: ${{ inputs.advertising || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/setra-1.4.0

      - name: Unpack full Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          for candidate in SetraMahjong_120_Project.zip SetraMahjong_1.2.0_HuaweiAds_Source_GitHub.zip; do
            if [ -s "$candidate" ]; then ZIP="$candidate"; break; fi
          done
          if [ -z "$ZIP" ]; then
            echo "::error::Upload SetraMahjong_120_Project.zip to the repository root first."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project
          test -f project/SetraMahjong/gradlew
          test -f project/SetraMahjong/app/build.gradle.kts
          chmod +x project/SetraMahjong/gradlew

      - name: Apply v1.2.1 fixes and v1.4.0 content expansion
        shell: bash
        run: |
          python3 tools/patch-release-121.py project/SetraMahjong
          python3 tools/patch-release-130.py project/SetraMahjong
          python3 tools/patch-release-131.py project/SetraMahjong
          python3 tools/patch-release-140.py project/SetraMahjong

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK command line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed production release with encrypted one-time signing transfer
        shell: bash
        working-directory: project/SetraMahjong
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/one-time.crt"
          KEY="$RUNNER_TEMP/one-time.key"
          openssl req -newkey rsa:3072 -x509 -nodes -days 1 -sha256 -keyout "$KEY" -out "$CERT" -subj "/CN=SetraMahjong-Run-$GITHUB_RUN_ID" >/dev/null 2>&1
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.secure-transfer/$GITHUB_RUN_ID.pem" -f message="Public one-time certificate $GITHUB_RUN_ID" -f content="$(base64 -w0 "$CERT")" >/dev/null
          echo "Ephemeral public certificate published. Awaiting encrypted signing package."
          ARRIVED=0
          for i in $(seq 1 210); do
            if gh api "repos/$GITHUB_REPOSITORY/contents/.secure-transfer/$GITHUB_RUN_ID.cms.txt" --jq '.content' > "$RUNNER_TEMP/signing-download.txt" 2>/dev/null; then ARRIVED=1; break; fi
            sleep 2
          done
          if [ "$ARRIVED" != 1 ]; then echo "::error::Encrypted signing package unavailable"; exit 1; fi
          base64 -d "$RUNNER_TEMP/signing-download.txt" | base64 -d > "$RUNNER_TEMP/signing.cms"
          openssl cms -decrypt -binary -inform DER -in "$RUNNER_TEMP/signing.cms" -recip "$CERT" -inkey "$KEY" -out "$RUNNER_TEMP/signing.tar.gz"
          mkdir -p "$RUNNER_TEMP/setra-private"
          tar -xzf "$RUNNER_TEMP/signing.tar.gz" -C "$RUNNER_TEMP/setra-private"
          test -f "$RUNNER_TEMP/setra-private/setra-release.jks"
          test -f "$RUNNER_TEMP/setra-private/env.sh"
          set -a
          source "$RUNNER_TEMP/setra-private/env.sh"
          set +a
          export SETRA_KEYSTORE_PATH="$RUNNER_TEMP/setra-private/setra-release.jks"
          # Publicly hosted multilingual policy; corrects an incorrectly entered HTTPS secret.
          export SETRA_PRIVACY_URL="https://github.com/mhmmad444410aa-ai/SetraMahjong/blob/main/PRIVACY_POLICY.md"
          # Recover the publisher's publicly recorded commit email only when the secret is malformed.
          if [[ "$SETRA_CONTACT_EMAIL" != *"@"* ]]; then
            export SETRA_CONTACT_EMAIL="$(gh api "repos/$GITHUB_REPOSITORY/commits/8fe8a72b9858bfac28cd34c82589048a9a5bd448" --jq '.commit.author.email')"
          fi
          keytool -list -keystore "$SETRA_KEYSTORE_PATH" -alias "$SETRA_KEY_ALIAS" -storepass:env SETRA_STORE_PASSWORD >/dev/null
          python3 tools/check_translations.py
          python3 tools/check_ads_integration.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          marker='    lint { abortOnError = true; checkReleaseBuilds = true }'
          assert marker in s
          p.write_text(s.replace(marker, marker + chr(10) + '    if (petalEnabled) lint.disable.add("NotificationPermission")' + chr(10) + '    if (petalEnabled) lint.disable.add("QueryAllPackagesPermission")'))
          PY
          ./gradlew :engine:test :app:assembleRelease :app:lintRelease --no-daemon -PpetalAds=true
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/release/app-release.apk | grep -F "android.permission.QUERY_ALL_PACKAGES"; then
            echo "::error::Broad package visibility must not be in final APK"
            exit 1
          fi
          python3 tools/verify_release.py app/build/outputs/apk/release/app-release.apk --sdk "$ANDROID_HOME" --advertising production --output release-checks
          LAUNCHER=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "^launchable-activity:" || true)
          grep -F "com.mhmmad.setramahjong.MainActivity" <<< "$LAUNCHER" || { echo "::error::Unexpected launcher; new v1.4.0 must start with integrated Compose home. Abort release."; exit 1; }
          COUNT=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree app/build/outputs/apk/release/app-release.apk AndroidManifest.xml | grep -c "android.intent.action.MAIN")
          test "$COUNT" -eq 1 || { echo "::error::More than one launcher"; exit 1; }
          echo "New authorized certificate, APK identity, ad IDs and Android signing verified."

      - name: Verify v1.4.0 package and new authorized signing certificate
        shell: bash
        working-directory: project/SetraMahjong
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          CERT="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK")"
          echo "$CERT" | grep -Fi '40db656d090e22d9d1ca998ef1cc9df56af501f039881a392fa539efe846a94b' >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.mhmmad.setramahjong' versionCode='7' versionName='1.4.0'" >/dev/null
          sha256sum "$APK" | tee release-checks/review-candidate-sha256.txt

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SetraMahjong-1.4.0-Signed-Review-Candidate-${{ env.ADS_BUILD_MODE }}
          path: |
            project/SetraMahjong/app/build/outputs/apk/release/app-release.apk
            project/SetraMahjong/release-checks/
            project/SetraMahjong/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed 1.4.0 APK for device testing
        working-directory: project/SetraMahjong
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SetraMahjong-v1.4.0-Release.apk
          (cd dist && sha256sum SetraMahjong-v1.4.0-Release.apk > SetraMahjong-v1.4.0-Release.apk.sha256)
          gh release create v1.4.0 dist/SetraMahjong-v1.4.0-Release.apk dist/SetraMahjong-v1.4.0-Release.apk.sha256 --target feature/setra-1.4.0 --prerelease --title 'Setra Mahjong 1.4.0 — New Puzzle Atelier (signed review build)' --notes 'Original Classic Mahjong preserved with illustrated in-app Garden Routes, Memory Grove, Daily Seed, three languages and refreshed home. VersionCode 7, same authorized signing key, build and static checks passed. Pre-release for real-device validation; no Huawei approval claim.'
      - name: Delete temporary signing material
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for path in ".secure-transfer/$GITHUB_RUN_ID.cms.txt" ".secure-transfer/$GITHUB_RUN_ID.pem"; do
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null)"
            if [ -n "$SHA" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/$path" -f message="Expire one-time transfer $GITHUB_RUN_ID" -f sha="$SHA" >/dev/null
            fi
          done
          rm -rf "$RUNNER_TEMP/setra-private" "$RUNNER_TEMP/signing.tar.gz" "$RUNNER_TEMP/signing.cms" "$RUNNER_TEMP/signing-download.txt" "$RUNNER_TEMP/one-time.crt" "$RUNNER_TEMP/one-time.key"
