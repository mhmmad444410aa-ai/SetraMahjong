name: Validate redesigned Setra Mahjong 1.4.0
on:
  push:
    branches: [feature/setra-1.4.0]
    paths:
      - 'source-v14/**'
      - 'tools/patch-release-140.py'
      - '.github/workflows/validate-setra-140.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/setra-1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test puzzle generators and prepare rebuilt original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-tests project
          javac -d game-tests expansion/GardenEngine.java expansion/GardenEngineTest.java
          java -cp game-tests GardenEngineTest
          unzip -q SetraMahjong_120_Project.zip -d project
          python3 tools/patch-release-121.py project/SetraMahjong
          python3 tools/patch-release-130.py project/SetraMahjong
          python3 tools/patch-release-131.py project/SetraMahjong
          python3 tools/patch-release-140.py project/SetraMahjong
          chmod +x project/SetraMahjong/gradlew
          python3 project/SetraMahjong/tools/check_translations.py
          python3 project/SetraMahjong/tools/check_ads_integration.py
          grep -q 'MiniGardenPromo' project/SetraMahjong/app/src/main/java/com/mhmmad/setramahjong/ui/Screens.kt
          ! grep -q consentDialog project/SetraMahjong/app/src/main/java/com/mhmmad/setramahjong/ui/Screens.kt
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and Android Huawei debug compilation
        working-directory: project/SetraMahjong
        run: ./gradlew :engine:test :app:assembleDebug --no-daemon -PpetalAds=true
      - name: Run production Lint without signing and print all errors
        working-directory: project/SetraMahjong
        shell: bash
        run: |
          # A disposable local test certificate satisfies the Gradle signing preflight.
          # It is generated fresh in CI and is NEVER a production release or a publisher key.
          export SETRA_KEYSTORE_PATH="$RUNNER_TEMP/setra-lint-only.jks"
          export SETRA_STORE_PASSWORD="$(openssl rand -hex 20)"
          export SETRA_KEY_PASSWORD="$SETRA_STORE_PASSWORD"
          export SETRA_KEY_ALIAS="lint-only"
          export SETRA_DEVELOPER_NAME="Lint Verification"
          export SETRA_CONTACT_EMAIL="lint@example.invalid"
          export SETRA_PRIVACY_URL="https://github.com/mhmmad444410aa-ai/SetraMahjong/blob/main/PRIVACY_POLICY.md"
          keytool -genkeypair -alias "$SETRA_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -keystore "$SETRA_KEYSTORE_PATH" -storepass:env SETRA_STORE_PASSWORD -keypass:env SETRA_KEY_PASSWORD -dname "CN=Setra CI lint-only" >/dev/null 2>&1
          # Identical two Huawei Ads SDK lint exclusions used by production signing job.
          # All application code and security lint rules remain enabled.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          marker="    lint { abortOnError = true; checkReleaseBuilds = true }"
          assert marker in s
          p.write_text(s.replace(marker,marker+chr(10)+'    if (petalEnabled) lint.disable.add("NotificationPermission")'+chr(10)+'    if (petalEnabled) lint.disable.add("QueryAllPackagesPermission")'))
          PY
          ./gradlew :app:lintRelease --no-daemon -PpetalAds=true || {
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt | grep -E -B 3 -A 3 'Error:|[0-9]+ errors' | head -100 || true
            exit 1
          }
      - name: Verify actual installed launcher, version and three new modes
        shell: bash
        working-directory: project/SetraMahjong
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "^package:|^launchable-activity:|^launchable-activity-alias:" || true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionCode='7' versionName='1.4.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "launchable-activity: name='com.mhmmad.setramahjong.MainActivity'"
          count=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -c 'android.intent.action.MAIN')
          test "$count" -eq 1
          unzip -l "$APK" | grep 'classes'
          echo 'Verified v1.4.0 original Compose launcher and extra in-app puzzle modes'
      - uses: actions/upload-artifact@v4
        with:
          name: SetraMahjong-1.4.0-debug-TEST-ONLY
          path: project/SetraMahjong/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
