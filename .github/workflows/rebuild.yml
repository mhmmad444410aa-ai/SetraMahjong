name: Setra 2.0 clean rebuild
on:
  push:
    branches: ['rebuild/setra-2.0.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test game rules
        run: |
          mkdir -p test-out
          javac -d test-out app/src/main/java/com/mhmmad/setramahjong/Puzzle.java tests/PuzzleTest.java
          java -cp test-out PuzzleTest
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Setra-2.0-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
