name: Legacy Setra Mahjong signed build (requires matching secrets)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/appgallery-4-1-v1.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test puzzle generation and unpack source
        run: |
          set -euo pipefail
          mkdir -p game-tests project
          javac -d game-tests expansion/GardenEngine.java expansion/GardenEngineTest.java
          java -cp game-tests GardenEngineTest
          unzip -q SetraMahjong_120_Project.zip -d project
          python3 tools/patch-release-121.py project/SetraMahjong
          python3 tools/patch-release-130.py project/SetraMahjong
          chmod +x project/SetraMahjong/gradlew
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile, sign and verify production candidate using authorized replacement key
        working-directory: project/SetraMahjong
        shell: bash
        env:
          SETRA_KEYSTORE_BASE64: ${{ secrets.SETRA_KEYSTORE_BASE64 }}
          SETRA_STORE_PASSWORD: ${{ secrets.SETRA_STORE_PASSWORD }}
          SETRA_KEY_ALIAS: ${{ secrets.SETRA_KEY_ALIAS }}
          SETRA_KEY_PASSWORD: ${{ secrets.SETRA_KEY_PASSWORD }}
          SETRA_DEVELOPER_NAME: ${{ secrets.SETRA_DEVELOPER_NAME }}
          SETRA_CONTACT_EMAIL: ${{ secrets.SETRA_CONTACT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          SETRA_PRIVACY_URL: https://github.com/mhmmad444410aa-ai/SetraMahjong/blob/main/PRIVACY_POLICY.md
        run: |
          set -euo pipefail
          for var in SETRA_KEYSTORE_BASE64 SETRA_STORE_PASSWORD SETRA_KEY_ALIAS SETRA_KEY_PASSWORD SETRA_DEVELOPER_NAME; do
            if [[ -z "${!var}" ]]; then echo "::error::Missing required repository secret: $var"; exit 1; fi
          done
          # Same public, verified publisher record used by the existing 1.2.1 workflow.
          if [[ "$SETRA_CONTACT_EMAIL" != *@* ]]; then
            SETRA_CONTACT_EMAIL="$(gh api "repos/$GITHUB_REPOSITORY/commits/8fe8a72b9858bfac28cd34c82589048a9a5bd448" --jq '.commit.author.email')"
            echo "::add-mask::$SETRA_CONTACT_EMAIL"
            export SETRA_CONTACT_EMAIL
          fi
          if [[ "$SETRA_CONTACT_EMAIL" != *@* ]]; then echo "::error::Invalid publisher contact"; exit 1; fi
          umask 077
          export SETRA_KEYSTORE_PATH="$RUNNER_TEMP/setra-130-original.jks"
          trap 'rm -f "$SETRA_KEYSTORE_PATH"' EXIT
          # Accept common mobile copy/paste formatting, but never guess or regenerate a key.
          python3 - <<'PY'
          import base64, binascii, os, re
          from pathlib import Path
          s=os.environ["SETRA_KEYSTORE_BASE64"].strip()
          if s.startswith("SETRA_KEYSTORE_BASE64="): s=s.split("=",1)[1].strip()
          if len(s)>=2 and s[0]==s[-1] and s[0] in ("'",'"'): s=s[1:-1]
          s=re.sub(r"\\r\\n|\\n|\\r|\s+", "", s)
          s=s.replace("-","+").replace("_","/")
          if not re.fullmatch(r"[A-Za-z0-9+/]+={0,2}",s):
              raise SystemExit("::error::SETRA_KEYSTORE_BASE64 is not a valid encoded keystore. Replace it with base64 of the original .jks file, not its filename, SHA-256 or password.")
          try:
              raw=base64.b64decode(s+"="*((-len(s))%4),validate=True)
          except (ValueError,binascii.Error):
              raise SystemExit("::error::SETRA_KEYSTORE_BASE64 is invalid or truncated. Re-encode the original signing file.")
          if len(raw)<256 or not (raw.startswith(bytes.fromhex("feedfeed")) or raw.startswith(bytes.fromhex("cececece")) or raw.startswith(b"\x30")):
              raise SystemExit("::error::Decoded secret is not a supported signing keystore. Use the original .jks/.p12.")
          Path(os.environ["SETRA_KEYSTORE_PATH"]).write_bytes(raw)
          print("Keystore encoding and file structure passed; checking original certificate next.")
          PY
          unset SETRA_KEYSTORE_BASE64
          # Check the public checksum of the newly generated signing file, not secret values.
          expected_keystore_sha256='5f261cd3160ff83a62051a293466220ad43305aa4dda2d82ea6dddbb4a2cecb3'
          actual_keystore_sha256="$(sha256sum "$SETRA_KEYSTORE_PATH" | cut -d' ' -f1)"
          if [[ "$actual_keystore_sha256" != "$expected_keystore_sha256" ]]; then
            echo "::error::SETRA_KEYSTORE_BASE64 does not match the newly generated Setra JKS. Update this GitHub secret with the COMPLETE value from the new private setup file."
            exit 1
          fi
          echo "Correct Setra signing file is installed."
          if ! LC_ALL=C keytool -list -keystore "$SETRA_KEYSTORE_PATH" -storepass:env SETRA_STORE_PASSWORD >/dev/null 2>&1; then
            # This new JKS was created with the same store/key password.
            # If the user updated only one password secret correctly, recover safely.
            if LC_ALL=C keytool -list -keystore "$SETRA_KEYSTORE_PATH" -storepass:env SETRA_KEY_PASSWORD >/dev/null 2>&1; then
              echo "::warning::SETRA_STORE_PASSWORD is incorrect, but the private key password secret matches the store. Using the validated value for this run."
              SETRA_STORE_PASSWORD="$SETRA_KEY_PASSWORD"
              export SETRA_STORE_PASSWORD
            else
              echo "::error::Correct Setra JKS is installed, but neither SETRA_STORE_PASSWORD nor SETRA_KEY_PASSWORD matches its password. Both must be set to the exact value in the private setup file."
              exit 1
            fi
          fi
          if ! cert=$(LC_ALL=C keytool -list -v -keystore "$SETRA_KEYSTORE_PATH" -alias "$SETRA_KEY_ALIAS" -storepass:env SETRA_STORE_PASSWORD 2>/dev/null); then
            echo "::error::Correct JKS and store password, but SETRA_KEY_ALIAS is incorrect. Replace with the exact alias from the new private setup."
            exit 1
          fi
          expected='40:DB:65:6D:09:0E:22:D9:D1:CA:99:8E:F1:CC:9D:F5:6A:F5:01:F0:39:88:1A:39:2F:A5:39:EF:E8:46:A9:4B'
          if ! grep -Fq "$expected" <<< "$cert"; then echo "::error::New Setra certificate mismatch; refusing to sign"; exit 1; fi
          unset cert
          python3 tools/check_translations.py
          python3 tools/check_ads_integration.py
          # Existing SDK-specific lint exclusions; merged manifest is checked below.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          marker='    lint { abortOnError = true; checkReleaseBuilds = true }'
          assert marker in s
          p.write_text(s.replace(marker,marker+chr(10)+'    if (petalEnabled) lint.disable.add("NotificationPermission")'+chr(10)+'    if (petalEnabled) lint.disable.add("QueryAllPackagesPermission")'))
          PY
          ./gradlew :engine:test :app:assembleRelease :app:lintRelease --no-daemon -PpetalAds=true
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.QUERY_ALL_PACKAGES'; then
            echo "::error::Broad package visibility found"; exit 1
          fi
          python3 tools/verify_release.py "$APK" --sdk "$ANDROID_HOME" --advertising production --output release-checks
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" > release-checks/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SetraMahjong-1.3.0-Signed-Review-Candidate
          path: |
            project/SetraMahjong/app/build/outputs/apk/release/app-release.apk
            project/SetraMahjong/release-checks/
          if-no-files-found: error
          retention-days: 14
