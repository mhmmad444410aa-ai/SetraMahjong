name: Validate Setra Mahjong 1.4.0 visual campaign
on:
  push:
    branches: [feature/setra-1.4.0-redesign]
  pull_request:
    branches: [main]
    paths:
      - 'expansion/**'
      - 'tools/patch-release-130.py'
      - 'tools/patch-release-131.py'
      - 'tools/patch-release-140.py'
      - '.github/workflows/validate-expansion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test standalone game rules
        run: |
          mkdir -p game-tests
          javac -d game-tests expansion/GardenEngine.java expansion/GardenEngineTest.java
          java -cp game-tests GardenEngineTest
      - name: Apply expansion to original source
        run: |
          mkdir -p project
          unzip -q SetraMahjong_120_Project.zip -d project
          python3 tools/patch-release-121.py project/SetraMahjong
          python3 tools/patch-release-130.py project/SetraMahjong
          python3 tools/patch-release-131.py project/SetraMahjong
          python3 tools/patch-release-140.py project/SetraMahjong
          chmod +x project/SetraMahjong/gradlew
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test Android debug build without release keys
        working-directory: project/SetraMahjong
        run: ./gradlew :engine:test :app:assembleDebug --no-daemon -PpetalAds=true
      - name: Assert Huawei flavor launches new Garden Routes/Memory hub
        working-directory: project/SetraMahjong
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionCode='7' versionName='1.4.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "package:|launchable-activity:|application-label:|MAIN" || true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E "android.intent.action.MAIN|GardenActivity|MainActivity|android.intent.category.LAUNCHER" || true
          echo '--- Manifest launch activity details ---'
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -A 28 -B 5 -E 'MainActivity|GardenActivity|android.intent.action.MAIN' || true
          echo '--- Android manifest merger report ---'
          find app/build -type f -iname '*manifest*report*' | head -5 | while read -r report; do grep -n -A 8 -B 4 -E 'GardenActivity|MainActivity|LAUNCHER' "$report" | head -150 || true; done
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "launchable-activity: name='com.mhmmad.setramahjong.expansion.GardenActivity'"
          count=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -c 'android.intent.action.MAIN')
          test "$count" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: SetraMahjong-1.4.0-debug-validation-only
          path: project/SetraMahjong/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
