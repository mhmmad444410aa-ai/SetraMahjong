name: Validate Setra Mahjong 1.3.1 Huawei launcher and modes
on:
  push:
    paths: ['.github/workflows/validate-setra-131.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/appgallery-4-1-v1.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test routes and memory engine; unpack and patch all launchers
        run: |
          set -euo pipefail
          mkdir -p game-tests project
          javac -d game-tests expansion/GardenEngine.java expansion/GardenEngineTest.java
          java -cp game-tests GardenEngineTest
          unzip -q SetraMahjong_120_Project.zip -d project
          python3 tools/patch-release-121.py project/SetraMahjong
          python3 tools/patch-release-130.py project/SetraMahjong
          python3 tools/patch-release-131.py project/SetraMahjong
          chmod +x project/SetraMahjong/gradlew
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build real Petal flavor Debug APK
        working-directory: project/SetraMahjong
        run: ./gradlew :engine:test :app:assembleDebug --no-daemon -PpetalAds=true
      - name: Reject stale launcher and verify new three-mode entry point
        shell: bash
        working-directory: project/SetraMahjong
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "versionCode='6' versionName='1.3.1'"
          echo "::group::Android launcher diagnostic"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -E "package:|launchable-activity:|launchable-activity-alias:" || true
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -B 20 -A 8 'android.intent.action.MAIN' || true
          echo "::endgroup::"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "launchable-activity: name='com.mhmmad.setramahjong.expansion.GardenActivity'"
          count=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -c 'android.intent.action.MAIN')
          test "$count" -eq 1 || { echo "::error::Expected one launcher, found $count"; exit 1; }
          echo "PASS: 1.3.1 Huawei/Petal APK starts at game collection, not old screen"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SetraMahjong-1.3.1-Huawei-debug-QA-only
          path: project/SetraMahjong/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 10
